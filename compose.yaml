services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      CHROMA_PATH: ${CHROMA_PATH:-./data/chroma_db}
      SQLITE_PATH: ${SQLITE_PATH:-./data/knowledge.db}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "8000:8000"
    volumes:
      - ./.cursor:/app/.cursor
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
